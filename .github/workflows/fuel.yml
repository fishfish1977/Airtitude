name: Update Singapore fuel prices
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  fuel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Plain request
        run: node fetch-fuel.mjs
      - name: Headless browser fallback
        run: |
          if [ "$(date -u +%F)" != "$(node -e "console.log(JSON.parse(require('fs').readFileSync('fuelsg.json','utf8')).asOf||'')")" ]; then
            npm i --no-save playwright >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
            node fetch-fuel.mjs
          fi
      - name: Commit if changed
        run: |
          git config user.name "fuel-bot"; git config user.email "fuel-bot@users.noreply.github.com"
          git add fuelsg.json
          git diff --cached --quiet || (git commit -m "Update SG fuel prices" && git push)
