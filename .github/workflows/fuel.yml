name: Update Singapore fuel prices
on:
  schedule:
    - cron: '23 0 * * *'    # once a day, 08:23 Singapore time
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  fuel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Install a headless browser (for pages that fill in prices with JavaScript)
        run: npm i --no-save playwright && npx playwright install --with-deps chromium
      - name: Read each brand's own price page
        run: node fetch-fuel.mjs --browser
      - name: Commit if changed
        run: |
          git config user.name "fuel-bot"; git config user.email "fuel-bot@users.noreply.github.com"
          git add fuelsg.json
          git diff --cached --quiet || (git commit -m "Update SG fuel prices" && git push)
